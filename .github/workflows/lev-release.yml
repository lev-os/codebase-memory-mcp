# Release of the lev branch: upstream's own test, build and smoke jobs, then one GitHub
# prerelease with the archives and checksums.txt in upstream's format.
#
# release.yml stays as upstream wrote it. That workflow also publishes to npm, PyPI and
# the MCP registry under upstream's names; this one publishes only the GitHub release.
# No VirusTotal key here, so the build selects the stripped candidates unscanned.
name: Lev release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.12.2-lev.1"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: lev-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept only lev prerelease tags from the lev branch
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          [[ "$REF" == "refs/heads/lev" ]] || { echo "run this from the lev branch, not $REF"; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-lev\.[0-9]+$ ]] || { echo "bad tag $VERSION"; exit 1; }

  test:
    needs: [preflight]
    uses: ./.github/workflows/_test.yml
    with:
      skip_perf: true
      broad_platforms: false
      shard_suites: true

  build:
    needs: [test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ inputs.version }}
      attest: false
      scan_candidates: false

  smoke:
    needs: [build]
    uses: ./.github/workflows/_smoke.yml
    with:
      broad_platforms: false

  release:
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the selected binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          ls -la *.tar.gz *.zip
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Tag the dispatched commit and publish the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          gh release create "$VERSION" --prerelease --verify-tag \
            --title "$VERSION" --notes "${NOTES:-Lev build of $GITHUB_SHA.}" \
            *.tar.gz *.zip checksums.txt
